{% extends 'base.html' %}{% block content %}<section class="form-card"><h1>Publish safety alert</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Title<input name="title" required maxlength="160"></label><label>Location<input name="location" maxlength="180"></label><label>Severity<select name="severity"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></label><label>Message<textarea name="message" required maxlength="3000"></textarea></label><button class="button">Publish alert</button></form></section>{% endblock %}
