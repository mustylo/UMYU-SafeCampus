{% extends 'base.html' %}{% block content %}<section class="form-card"><h1>Submit a campus report</h1><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Service type<select name="case_type"><option value="service_request">Service request</option><option value="incident">Incident</option><option value="complaint">Complaint</option><option value="emergency">Emergency</option></select></label><label>Category<select name="category_id" required>{% for category in categories %}<option value="{{ category.id }}">{{ category.name }}</option>{% endfor %}</select></label><label>Priority<select name="priority"><option>low</option><option selected>medium</option><option>high</option><option>critical</option></select></label><label>Location<input name="location" maxlength="180"></label><label>Description<textarea required name="description" maxlength="5000"></textarea></label><button class="button">Submit report</button></form></section>{% endblock %}
